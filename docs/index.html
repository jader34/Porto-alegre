<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anotações - Obsidian Vault Reader</title>
    
    <!-- Mobile PWA Meta Tags -->
    <meta name="theme-color" content="#0f1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Top Navbar Header -->
        <header class="top-header">
            <div class="header-left">
                <button id="btn-menu" class="icon-btn" aria-label="Abrir Menu">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div id="current-title" class="current-title">Anotações</div>
            </div>
            <div class="header-right">
                <button id="btn-controls" class="icon-btn" aria-label="Configurações de Leitura">
                    <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg>
                </button>
            </div>
        </header>

        <!-- Sidebar Mobile Backdrop Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar Drawer Navigation -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="brand-title">
                        <span>📖 Obsidian Notes</span>
                    </div>
                </div>
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Buscar anotações...">
                </div>
            </div>

            <!-- Folder Filter Pills -->
            <div id="filter-container" class="filter-container">
                <!-- Populated dynamically -->
            </div>

            <!-- Notes List -->
            <div id="notes-list" class="notes-list">
                <!-- Populated dynamically -->
            </div>
        </aside>

        <!-- Reading Controls Popup -->
        <div id="controls-modal" class="controls-modal">
            <div class="control-group">
                <span class="control-label">Tema</span>
                <div class="btn-group">
                    <button class="btn-option" data-theme-set="dark">Escuro</button>
                    <button class="btn-option" data-theme-set="light">Claro</button>
                    <button class="btn-option" data-theme-set="sepia">Sépia</button>
                </div>
            </div>
            <div class="control-group">
                <span class="control-label">Fonte</span>
                <div class="btn-group">
                    <button class="btn-option" data-font-set="sans">Sans</button>
                    <button class="btn-option" data-font-set="serif">Serif</button>
                </div>
            </div>
            <div class="control-group">
                <span class="control-label">Tamanho da Fonte</span>
                <div class="btn-group">
                    <button id="font-decrease" class="btn-option">A-</button>
                    <button id="font-increase" class="btn-option">A+</button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <div class="reading-container">
                <div id="reader-container">
                    <!-- Markdown Content Rendered Here -->
                </div>
            </div>
        </main>

        <!-- Scroll To Top FAB -->
        <button id="fab-top" class="fab-top" aria-label="Voltar ao Topo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Vault Data & Application Logic -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
